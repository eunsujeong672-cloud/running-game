<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>러닝 게임 프로토타입</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
        }
        canvas {
            background-color: #ffffff;
            border: 2px solid #333;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="800" height="400"></canvas>
    
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const player = {
            x: 50,
            y: 300,
            width: 40,
            height: 40,
            dy: 0,
            jumpPower: -12,
            gravity: 0.6,
            isGrounded: true
        };

        const obstacles = [];
        let score = 0; 
        let isGameOver = false;
        
        // 난이도 조절용 변수
        let gameSpeed = 6;      // 기본 속도
        let spawnTimer = 100;   // 장애물 생성 타이머

        class Obstacle {
            constructor() {
                this.width = 30;
                this.height = 30 + Math.random() * 20; 
                this.x = canvas.width;
                this.y = canvas.height - 50 - this.height;
                // 현재 게임 속도에 기반하되 장애물마다 약간의 속도 차이를 줌
                this.speed = gameSpeed + Math.random() * 1.5; 
            }

            draw() {
                ctx.fillStyle = '#1e90ff';
                ctx.fillRect(this.x, this.y, this.width, this.height);
            }

            update() {
                this.x -= this.speed;
            }
        }

        function resetGame() {
            player.y = 300;
            player.dy = 0;
            player.isGrounded = true;
            
            obstacles.length = 0; 
            score = 0;
            isGameOver = false;
            
            // 난이도 관련 변수 초기화
            gameSpeed = 6;
            spawnTimer = 100;
            
            gameLoop(); 
        }

        window.addEventListener('keydown', function(e) {
            if (e.code === 'Space') {
                if (isGameOver) {
                    resetGame();
                } else if (player.isGrounded) {
                    player.dy = player.jumpPower;
                    player.isGrounded = false;
                }
            }
        });

        function update() {
            if (isGameOver) return;

            score++;
            
            // 시간이 지날수록 게임 기본 속도를 미세하게 증가시킴
            gameSpeed += 0.002;

            player.dy += player.gravity;
            player.y += player.dy;

            const groundLevel = canvas.height - 50; 
            if (player.y + player.height > groundLevel) {
                player.y = groundLevel - player.height;
                player.dy = 0;
                player.isGrounded = true;
            }

            // 장애물 생성 로직 (속도가 빨라질수록 주기도 짧아짐)
            spawnTimer--;
            if (spawnTimer <= 0) {
                obstacles.push(new Obstacle());
                
                // 다음 장애물이 나올 때까지의 대기 시간 계산
                // 속도가 빠를수록 타이머가 짧아지며, 최소 50프레임 보장 + 랜덤 지연 추가
                let minTime = Math.max(50, 120 - gameSpeed * 5);
                spawnTimer = minTime + Math.random() * 40;
            }

            for (let i = 0; i < obstacles.length; i++) {
                let obs = obstacles[i];
                obs.update();

                if (obs.x + obs.width < 0) {
                    obstacles.splice(i, 1);
                    i--;
                    continue;
                }

                if (
                    player.x < obs.x + obs.width &&
                    player.x + player.width > obs.x &&
                    player.y < obs.y + obs.height &&
                    player.y + player.height > obs.y
                ) {
                    isGameOver = true;
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 바닥
            ctx.fillStyle = '#888';
            ctx.fillRect(0, canvas.height - 50, canvas.width, 50);

            // 점수 및 현재 속도 텍스트
            ctx.fillStyle = 'black';
            ctx.font = '20px Arial';
            ctx.textAlign = 'left';
            ctx.fillText('Score: ' + score, 20, 30);
            
            // 플레이어가 속도감을 인지할 수 있도록 현재 속도 레벨 표시 (소수점 버림)
            ctx.fillStyle = '#666';
            ctx.font = '16px Arial';
            ctx.fillText('Speed Level: ' + Math.floor(gameSpeed), 20, 55);

            // 플레이어
            ctx.fillStyle = '#ff4757';
            ctx.fillRect(player.x, player.y, player.width, player.height);

            // 장애물
            obstacles.forEach(obs => obs.draw());

            if (isGameOver) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = 'white';
                ctx.font = '40px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 20);
                
                ctx.font = '20px Arial';
                ctx.fillText('Press Space to Restart', canvas.width / 2, canvas.height / 2 + 30);
            }
        }

        function gameLoop() {
            update();
            draw();
            if (!isGameOver) {
                requestAnimationFrame(gameLoop);
            }
        }

        gameLoop();
    </script>
</body>
</html>
